<!DOCTYPE html>
<html>

<head>
    <title>Employee Signup</title>
</head>

<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e0f7fa; margin: 0; padding: 0;">

    <div
        style="max-width: 550px; margin: 60px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #17a2b8;">Employee Signup</h2>

        <form id="employeeSignupForm" style="margin-top: 30px;">
            <label style="font-weight: bold;">Name:</label><br>
            <input type="text" id="name" required
                style="width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px;"><br>

            <label style="font-weight: bold;">Position:</label><br>
            <input type="text" id="position" required
                style="width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px;"><br>

            <label style="font-weight: bold;">Password:</label><br>
            <input type="password" id="password" required
                style="width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ccc; border-radius: 5px;"><br>

            <label style="font-weight: bold;">Salary:</label><br>
            <input type="number" id="salary" required
                style="width: 100%; padding: 10px; margin: 5px 0 25px; border: 1px solid #ccc; border-radius: 5px;"><br>

            <button type="submit"
                style="width: 100%; background: #17a2b8; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 5px; cursor: pointer;">
                Signup
            </button>
        </form>

        <div id="employeeSignupResult" style="margin-top: 25px; text-align: center; font-weight: bold; color: #333;">
        </div>
    </div>

    <script>
        document.getElementById("employeeSignupForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const position = document.getElementById("position").value;
            const password = document.getElementById("password").value;
            const salary = document.getElementById("salary").value;

            const res = await fetch("signupEmployee", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, position, password, salary })
            });

            const data = await res.json();
            document.getElementById("employeeSignupResult").innerHTML = `
  <p style="margin-bottom: 8px;"><strong>${data.success}</strong></p>
  <p>Your token is:</p>
  <div style="background: #f4f4f4; padding: 10px; border-radius: 5px; word-break: break-all; font-family: monospace; font-size: 14px; color: #333;">
    ${data.token}
  </div>

`;
        });
    </script>

</body>

</html>
